<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Taxi Fare Calculator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 350px; width: 100%; }
    </style>
</head>
<body class="bg-slate-100 font-sans">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between">
        <!-- Header -->
        <div class="bg-amber-400 p-4 text-slate-900 font-bold text-lg text-center shadow-md">
            Bike Taxi Booking & Pricing
        </div>

        <!-- Map Container -->
        <div class="relative">
            <div id="map"></div>
            <button onclick="getCurrentLocation()" class="absolute bottom-3 right-3 bg-white px-3 py-1.5 rounded-full shadow-md text-xs font-semibold text-slate-700 z-[1000] border">
                📍 My Location
            </button>
        </div>

        <!-- Booking Details Panel -->
        <div class="p-4 flex-1 flex flex-col justify-between space-y-4">
            <div class="space-y-3">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <p class="text-xs text-slate-500 font-medium">PICKUP</p>
                    <p id="pickup-text" class="text-sm font-semibold text-slate-800">Fetching current location...</p>
                </div>

                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <p class="text-xs text-slate-500 font-medium">DESTINATION</p>
                    <p class="text-xs text-amber-600 font-medium">Tap anywhere on the map to set drop location</p>
                    <p id="drop-text" class="text-sm font-semibold text-slate-800">Not selected yet</p>
                </div>
            </div>

            <!-- Price Breakdown Card -->
            <div id="fare-card" class="hidden border-2 border-amber-400 bg-amber-50/50 p-4 rounded-xl space-y-2">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-slate-800">Bike Ride (Fastest)</span>
                    <span id="price-display" class="text-2xl font-black text-slate-900">₹0</span>
                </div>
                <div class="flex justify-between text-xs text-slate-600 border-t border-amber-200 pt-2">
                    <span id="distance-display">Distance: 0 km</span>
                    <span id="eta-display">ETA: 0 mins</span>
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="bookRide()" id="book-btn" disabled class="w-full bg-slate-300 text-slate-500 font-bold py-3.5 rounded-xl transition-all shadow-sm cursor-not-allowed">
                Select Destination on Map
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, pickupMarker, dropMarker, routeLine;
        let pickupCoords = null;
        let dropCoords = null;
        let calculatedDistanceKm = 0;
        let calculatedFare = 0;

        // Initialize Map
        function initMap() {
            // Default center (Mumbai fallback)
            map = L.map('map').setView([18.922, 72.834], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Listen for destination clicks on the map
            map.on('click', function(e) {
                dropCoords = [e.latlng.lat, e.latlng.lng];
                setDropPin(dropCoords);
                if (pickupCoords) {
                    calculateRouteAndPrice();
                }
            });

            getCurrentLocation();
        }

        // Get User's Real-time GPS Location
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        pickupCoords = [position.coords.latitude, position.coords.longitude];
                        setPickupPin(pickupCoords);
                        document.getElementById('pickup-text').innerText = `Lat: ${pickupCoords[0].toFixed(4)}, Lng: ${pickupCoords[1].toFixed(4)}`;
                        map.setView(pickupCoords, 14);
                        if (dropCoords) calculateRouteAndPrice();
                    },
                    (error) => {
                        alert("Error getting location. Please enable GPS permissions.");
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        function setPickupPin(coords) {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker(coords).addTo(map).bindPopup("Pickup Location").openPopup();
        }

        function setDropPin(coords) {
            if (dropMarker) map.removeLayer(dropMarker);
            dropMarker = L.marker(coords, {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                })
            }).addTo(map).bindPopup("Drop Location").openPopup();
            document.getElementById('drop-text').innerText = `Lat: ${coords[0].toFixed(4)}, Lng: ${coords[1].toFixed(4)}`;
        }

        // Calculate Route & Distance using Free OSRM Public API
        async function calculateRouteAndPrice() {
            if (!pickupCoords || !dropCoords) return;

            const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords[1]},${pickupCoords[0]};${dropCoords[1]},${dropCoords[0]}?overview=full&geometries=geojson`;

            try {
                let response = await fetch(url);
                let data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    let route = data.routes[0];
                    calculatedDistanceKm = route.distance / 1000; // convert meters to km
                    let durationMins = Math.round(route.duration / 60);

                    // Draw route polyline on map
                    if (routeLine) map.removeLayer(routeLine);
                    routeLine = L.geoJSON(route.geometry, {
                        style: { color: '#f59e0b', weight: 5, opacity: 0.8 }
                    }).addTo(map);

                    // Compute Custom Kilometer-Wise Price
                    calculatedFare = calculateCustomFare(calculatedDistanceKm);

                    // Update UI Display
                    document.getElementById('distance-display').innerText = `Distance: ${calculatedDistanceKm.toFixed(1)} km`;
                    document.getElementById('eta-display').innerText = `ETA: ${durationMins} mins`;
                    document.getElementById('price-display').innerText = `₹${calculatedFare}`;
                    document.getElementById('fare-card').classList.remove('hidden');

                    let bookBtn = document.getElementById('book-btn');
                    bookBtn.disabled = false;
                    bookBtn.className = "w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-3.5 rounded-xl transition-all shadow-md cursor-pointer";
                    bookBtn.innerText = `Book Bike - ₹${calculatedFare}`;
                }
            } catch (err) {
                console.error("Routing error: ", err);
            }
        }

        // Custom Kilometer-Wise Pricing Formula
        function calculateCustomFare(km) {
            const baseFare = 20;      // Base price for first 2 km
            const baseKm = 2;
            const perKmRate = 12;     // ₹12 per extra km
            const minPrice = 25;      // Absolute minimum floor

            let total = baseFare;
            if (km > baseKm) {
                total += (km - baseKm) * perKmRate;
            }
            return Math.max(minPrice, Math.round(total));
        }

        // Optional: Save Booking to Firebase Realtime Database (Free Tier)
        function bookRide() {
            alert(`Ride booked successfully! Total Fare: ₹${calculatedFare} for ${calculatedDistanceKm.toFixed(1)} km.`);
            // You can push data to Firebase Realtime Database here if needed
        }

        window.onload = initMap;
    </script>
</body>
</html>
