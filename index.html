<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BR Bike Taxi App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 0; }
        .app-container { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden">

    <!-- Leaflet Map Background -->
    <div id="map"></div>

    <!-- Main Container -->
    <div class="app-container h-screen flex flex-col justify-between p-4 pb-20">
        
        <!-- TOP SEARCH BAR CONTAINER (Rapido Style) -->
        <div class="interactive bg-white rounded-2xl shadow-xl p-4 border border-gray-100 space-y-3">
            <div class="flex items-center justify-between">
                <button onclick="resetApp()" class="p-1 rounded-full hover:bg-gray-100 text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                </button>
                <span class="text-xs font-bold uppercase tracking-wider bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full">BR Bike Taxi App</span>
                <button onclick="toggleSettings()" class="text-xs bg-gray-100 text-gray-700 px-3 py-1 rounded-lg font-medium">⚙️ Rate: ₹<span id="displayRate">12</span>/km</button>
            </div>

            <!-- Route Inputs -->
            <div class="relative flex items-start space-x-3">
                <div class="flex flex-col items-center h-20 justify-between py-1">
                    <span class="w-3 h-3 bg-green-500 rounded-full ring-4 ring-green-100"></span>
                    <span class="w-0.5 h-10 bg-gray-300"></span>
                    <span class="w-3 h-3 bg-red-500 rounded-full ring-4 ring-red-100"></span>
                </div>

                <div class="flex-1 space-y-2">
                    <!-- Pickup Input -->
                    <div class="bg-gray-50 rounded-xl px-3 py-2 border border-gray-200 flex items-center justify-between">
                        <input id="pickupInput" type="text" value="Acquiring GPS location..." class="bg-transparent text-sm w-full outline-none text-gray-800 font-medium" readonly>
                        <span class="text-xs text-green-600 font-semibold bg-green-50 px-2 py-0.5 rounded">Live</span>
                    </div>

                    <!-- Destination Input -->
                    <div class="bg-white rounded-xl px-3 py-2 border-2 border-yellow-400 flex items-center shadow-sm">
                        <input id="destInput" type="text" placeholder="Where do you want to go? (Type any place...)" oninput="debounceSearch(this.value)" class="bg-transparent text-sm w-full outline-none text-gray-900 font-semibold">
                        <button onclick="clearDestination()" class="text-gray-400 hover:text-gray-600 px-1">✕</button>
                    </div>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="flex space-x-2 pt-1">
                <button onclick="recenterGPS()" class="flex-1 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-700 flex items-center justify-center space-x-1 hover:bg-gray-100">
                    <span>📍 Refresh GPS</span>
                </button>
                <button onclick="alert('Voice search activated. Speak destination.')" class="flex-1 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-700 flex items-center justify-center space-x-1 hover:bg-gray-100">
                    <span>🎤 Voice Search</span>
                </button>
            </div>

            <!-- Suggestions Drawer -->
            <div id="suggestionsList" class="hidden max-h-40 overflow-y-auto divide-y divide-gray-100 border-t border-gray-100 pt-2"></div>
        </div>

        <!-- SETTINGS MODAL -->
        <div id="settingsModal" class="hidden interactive fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                <h3 class="font-bold text-lg text-gray-800">Fare Configuration</h3>
                <div>
                    <label class="text-xs text-gray-500 font-medium">Base Fare (₹)</label>
                    <input id="baseFareInput" type="number" value="30" class="w-full mt-1 p-2 border rounded-xl font-semibold">
                </div>
                <div>
                    <label class="text-xs text-gray-500 font-medium">Per KM Rate (₹)</label>
                    <input id="perKmInput" type="number" value="12" class="w-full mt-1 p-2 border rounded-xl font-semibold">
                </div>
                <button onclick="saveSettings()" class="w-full py-3 bg-yellow-400 hover:bg-yellow-500 font-bold rounded-xl text-sm shadow-md">Save & Apply</button>
            </div>
        </div>

        <!-- BOTTOM CARDS CONTAINER -->
        <div class="space-y-3 mb-4">
            
            <!-- BOOKING CARD -->
            <div id="bookingCard" class="interactive hidden bg-white rounded-2xl shadow-xl p-4 border border-gray-100 space-y-4">
                <div class="flex items-center justify-between border-b pb-3">
                    <div class="flex items-center space-x-3">
                        <div class="bg-yellow-400 p-2.5 rounded-xl text-xl">🛵</div>
                        <div>
                            <h4 class="font-bold text-gray-900 text-sm">BR Bike Taxi</h4>
                            <p class="text-xs text-gray-500"><span id="tripDist">0</span> km • Est. <span id="tripTime">0</span> mins</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-lg font-black text-gray-900">₹<span id="tripPrice">0</span></span>
                        <p class="text-[10px] text-green-600 font-semibold uppercase">Inclusive of all taxes</p>
                    </div>
                </div>

                <div class="flex space-x-2">
                    <button onclick="startRide()" class="w-full bg-black text-yellow-400 py-3 rounded-xl font-bold text-sm shadow-lg hover:bg-gray-900 transition flex items-center justify-center space-x-2">
                        <span>🚀 Start Booking / Ride</span>
                    </button>
                </div>
            </div>

            <!-- ACTIVE NAVIGATION / IN-TRANSIT CARD (Always visible during trip) -->
            <div id="activeRideCard" class="interactive hidden bg-black text-white rounded-2xl shadow-2xl p-4 space-y-3 border-2 border-yellow-400">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-[10px] bg-yellow-400 text-black font-extrabold px-2 py-0.5 rounded uppercase">In Transit</span>
                        <h4 class="font-bold text-base mt-1">Trip Live & Meter Running</h4>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-gray-400">Rate Active</span>
                        <p class="text-sm font-semibold text-yellow-400">₹<span id="activeRateDisp">12</span>/km</p>
                    </div>
                </div>
                <div class="flex space-x-2 pt-1">
                    <button onclick="openExternalNavigation()" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-black py-3 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 shadow-md">
                        <span>🗺️ Open Maps GPS</span>
                    </button>
                    <button onclick="endRide()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold text-xs shadow-md flex items-center justify-center">
                        <span>🏁 End Ride & Bill</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- POST-RIDE BILL SUMMARY MODAL -->
    <div id="billModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl text-center">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
            <h3 class="text-xl font-black text-gray-900">Trip Completed!</h3>
            <p class="text-xs text-gray-500">Thank you for riding with BR Bike Taxi App.</p>
            
            <div class="bg-gray-50 rounded-2xl p-4 text-left space-y-2 border border-gray-100 text-sm">
                <div class="flex justify-between"><span>Total Distance:</span> <span id="billDist" class="font-bold">0 km</span></div>
                <div class="flex justify-between"><span>Base + Distance Fare:</span> <span id="billFare" class="font-bold">₹0</span></div>
                <div class="border-t pt-2 flex justify-between text-base font-black text-gray-900"><span>Final Payable:</span> <span id="billTotal" class="text-green-600">₹0</span></div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="shareWhatsApp()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center space-x-1">
                    <span>💬 Share WhatsApp Bill</span>
                </button>
                <button onclick="resetApp()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-xl font-bold text-xs">
                    New Ride
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        let baseFare = 30;
        let perKmRate = 12;
        let currentLatLng = [19.0760, 72.8777]; // Fallback center
        let destinationLatLng = null;
        let routeLayer = null;
        let selectedDestName = "";
        let searchTimeout = null;

        // Initialize Leaflet Map
        const map = L.map('map', { zoomControl: false }).setView(currentLatLng, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let pickupMarker = L.marker(currentLatLng).addTo(map).bindPopup("<b>Pickup Point (GPS)</b>");

        // Real Live Geolocation
        function initGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentLatLng = [position.coords.latitude, position.coords.longitude];
                    map.setView(currentLatLng, 15);
                    pickupMarker.setLatLng(currentLatLng);
                    document.getElementById('pickupInput').value = "Your Live GPS Location";
                }, error => {
                    console.warn("GPS Error:", error);
                    document.getElementById('pickupInput').value = "Default Location (GPS Disabled)";
                }, { enableHighAccuracy: true });
            }
        }
        initGPS();

        function recenterGPS() {
            initGPS();
            map.setView(currentLatLng, 15);
        }

        // Live OpenStreetMap Nominatim Search
        function debounceSearch(query) {
            clearTimeout(searchTimeout);
            if (!query || query.length < 3) {
                document.getElementById('suggestionsList').classList.add('hidden');
                return;
            }
            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=5`)
                    .then(response => response.json())
                    .then(data => {
                        const list = document.getElementById('suggestionsList');
                        if (!data || data.length === 0) {
                            list.classList.add('hidden');
                            return;
                        }
                        list.innerHTML = data.map(item => {
                            const distVal = calculateDistance(currentLatLng[0], currentLatLng[1], parseFloat(item.lat), parseFloat(item.lon)).toFixed(1);
                            return `
                                <div onclick="selectDestination('${item.display_name.replace(/'/g, "")}', ${item.lat}, ${item.lon}, '${distVal}')" class="py-2.5 px-2 hover:bg-gray-50 cursor-pointer flex items-center justify-between">
                                    <div class="pr-2 truncate">
                                        <p class="text-xs font-bold text-gray-800 truncate">${item.display_name.split(',')[0]}</p>
                                        <p class="text-[10px] text-gray-500 truncate">${item.display_name}</p>
                                    </div>
                                    <span class="text-xs font-semibold text-gray-600 whitespace-nowrap">${distVal} km</span>
                                </div>
                            `;
                        }).join('');
                        list.classList.remove('hidden');
                    })
                    .catch(err => console.error("Search error:", err));
            }, 400);
        }

        // Distance Calculation with Road Adjustment Multiplier (~1.25x straight line for actual road routing)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let straightKm = R * c;
            return straightKm * 1.25; // Standard road circuity factor
        }

        let destinationMarker = null;

        function selectDestination(name, lat, lon, dist) {
            selectedDestName = name;
            document.getElementById('destInput').value = name.split(',')[0];
            document.getElementById('suggestionsList').classList.add('hidden');
            destinationLatLng = [parseFloat(lat), parseFloat(lon)];

            let calculatedPrice = Math.round(baseFare + (parseFloat(dist) * perKmRate));
            let estTime = Math.max(3, Math.round(parseFloat(dist) * 2.5));

            document.getElementById('tripDist').innerText = dist;
            document.getElementById('tripTime').innerText = estTime;
            document.getElementById('tripPrice').innerText = calculatedPrice;

            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.marker(destinationLatLng).addTo(map).bindPopup(`<b>Destination:</b> ${name}`).openPopup();
            
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.polyline([currentLatLng, destinationLatLng], { color: '#000', weight: 4, dashArray: '5, 5' }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

            document.getElementById('bookingCard').classList.remove('hidden');
        }

        function clearDestination() {
            document.getElementById('destInput').value = '';
            document.getElementById('suggestionsList').classList.add('hidden');
            document.getElementById('bookingCard').classList.add('hidden');
            document.getElementById('activeRideCard').classList.add('hidden');
            if (routeLayer) map.removeLayer(routeLayer);
            if (destinationMarker) map.removeLayer(destinationMarker);
        }

        function startRide() {
            document.getElementById('bookingCard').classList.add('hidden');
            document.getElementById('activeRideCard').classList.remove('hidden');
            document.getElementById('activeRateDisp').innerText = perKmRate;
        }

        function openExternalNavigation() {
            if (!destinationLatLng) {
                alert("Please select a destination first.");
                return;
            }
            // Opens Google Maps navigation in target blank safely without breaking PWA state
            const url = `https://www.google.com/maps/dir/?api=1&destination=${destinationLatLng[0]},${destinationLatLng[1]}&travelmode=driving`;
            window.open(url, '_blank');
        }

        function endRide() {
            document.getElementById('activeRideCard').classList.add('hidden');
            
            const dist = document.getElementById('tripDist').innerText;
            const price = document.getElementById('tripPrice').innerText;
            document.getElementById('billDist').innerText = dist + " km";
            document.getElementById('billFare').innerText = "₹" + price;
            document.getElementById('billTotal').innerText = "₹" + price;

            document.getElementById('billModal').classList.remove('hidden');
        }

        function shareWhatsApp() {
            const dist = document.getElementById('tripDist').innerText;
            const total = document.getElementById('billTotal').innerText;
            const text = encodeURIComponent(`*BR Bike Taxi Receipt* 🛵\nDestination: ${selectedDestName}\nDistance: ${dist} km\nTotal Fare: ${total}\nThank you for riding with us!`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveSettings() {
            baseFare = parseFloat(document.getElementById('baseFareInput').value) || 30;
            perKmRate = parseFloat(document.getElementById('perKmInput').value) || 12;
            document.getElementById('displayRate').innerText = perKmRate;
            toggleSettings();
            
            if (destinationLatLng) {
                const distVal = calculateDistance(currentLatLng[0], currentLatLng[1], destinationLatLng[0], destinationLatLng[1]).toFixed(1);
                let calculatedPrice = Math.round(baseFare + (parseFloat(distVal) * perKmRate));
                document.getElementById('tripPrice').innerText = calculatedPrice;
            }
        }

        function resetApp() {
            clearDestination();
            document.getElementById('billModal').classList.add('hidden');
            map.setView(currentLatLng, 14);
        }
    </script>
</body>
</html>
