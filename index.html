<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Bike Taxi Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 220px; width: 100%; z-index: 10; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
    <div class="max-w-md mx-auto bg-slate-950 min-h-screen shadow-2xl flex flex-col justify-between relative border-x border-slate-800">
        
        <!-- Header & Settings Toggle -->
        <div class="bg-slate-900 text-white p-4 flex justify-between items-center z-50 border-b border-slate-800">
            <div>
                <h1 class="font-bold text-sm flex items-center gap-1.5">👨‍✈️ RapidRide Terminal</h1>
                <p id="terminal-status" class="text-[10px] text-emerald-400 font-medium">● Online & Ready</p>
            </div>
            <button onclick="toggleSettings()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 font-medium cursor-pointer">
                ⚙️ Fare Settings
            </button>
        </div>

        <!-- Pricing Control Drawer -->
        <div id="settings-drawer" class="hidden bg-slate-900 text-white p-4 space-y-3 border-b border-slate-800 text-xs z-50">
            <h2 class="font-bold text-amber-400 text-sm">🎛️ Fare Controls</h2>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-slate-400">Per KM Rate (₹):</label>
                    <input type="number" id="setting-per-km" value="12" oninput="updatePricingConfig()" class="w-full bg-slate-950 border border-slate-700 p-1.5 rounded text-white mt-1">
                </div>
                <div>
                    <label class="text-slate-400">Base Fare (₹):</label>
                    <input type="number" id="setting-base" value="20" oninput="updatePricingConfig()" class="w-full bg-slate-950 border border-slate-700 p-1.5 rounded text-white mt-1">
                </div>
            </div>
            <div class="flex items-center justify-between pt-1">
                <span class="text-slate-300">🌙 Night Shift (+25%):</span>
                <input type="checkbox" id="setting-night" onchange="updatePricingConfig()" class="w-4 h-4 accent-amber-400 cursor-pointer">
            </div>
        </div>

        <!-- Destination Search Box -->
        <div class="p-4 bg-slate-950 shadow-sm relative z-40 space-y-3">
            <div class="flex items-center bg-slate-900 rounded-xl px-4 py-3 border border-slate-800 shadow-inner">
                <span class="text-slate-400 mr-2 text-base">📍</span>
                <input type="text" id="search-input" placeholder="Search customer destination..." 
                       oninput="searchLocation(this.value)"
                       class="bg-transparent w-full focus:outline-none text-slate-100 font-medium text-xs">
            </div>
            <div id="suggestions-list" class="absolute top-36 left-4 right-4 bg-slate-900 rounded-xl shadow-2xl border border-slate-800 hidden max-h-60 overflow-y-auto z-[9999]"></div>
        </div>

        <!-- Map Container -->
        <div class="relative">
            <div id="map"></div>
            <button onclick="getCurrentLocation()" class="absolute bottom-3 right-3 bg-slate-900 text-slate-200 px-3 py-1.5 rounded-full shadow-md text-xs font-semibold z-20 border border-slate-700">
                🎯 GPS Lock
            </button>
        </div>

        <!-- Bottom Details Panel -->
        <div class="p-4 flex-1 flex flex-col justify-between space-y-3 bg-slate-950">
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Pickup</p>
                    <p id="pickup-text" class="text-xs font-semibold text-slate-200 truncate">Acquiring GPS...</p>
                </div>
                <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Drop-off</p>
                    <p id="drop-text" class="text-xs font-semibold text-slate-200 truncate">Select destination</p>
                </div>
            </div>

            <!-- Price & Distance Bill Preview Card -->
            <div id="fare-card" class="hidden border-2 border-amber-500 bg-amber-950/30 p-3.5 rounded-2xl space-y-2">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="font-bold text-white text-sm">🏍️ Customer Bill Preview</span>
                        <span id="night-badge" class="hidden ml-1 text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded-full font-bold">Night</span>
                    </div>
                    <span id="price-display" class="text-xl font-black text-amber-400">₹0</span>
                </div>
                <div class="flex justify-between text-xs text-slate-300 border-t border-amber-900/50 pt-1.5 font-medium">
                    <span id="distance-display">Distance: 0 km</span>
                    <span id="eta-display">ETA: 0 mins</span>
                </div>
            </div>

            <!-- Inbuilt Navigation Instructions Box (Hidden until trip starts) -->
            <div id="nav-instructions" class="hidden bg-slate-900 border border-emerald-500/50 p-3 rounded-xl space-y-1">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] uppercase tracking-wider text-emerald-400 font-bold">🧭 Inbuilt Navigation Active</span>
                    <span id="nav-mode-dist" class="text-xs font-bold text-white">Shortest Route</span>
                </div>
                <p id="step-instruction" class="text-xs text-slate-200 font-medium">Head toward the main road and follow optimal path.</p>
            </div>

            <!-- Driver Action Buttons Flow -->
            <div class="space-y-2">
                <button onclick="startInbuiltNavigation()" id="nav-btn" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl transition-all shadow-sm cursor-not-allowed text-xs flex items-center justify-center gap-1.5">
                    🧭 Start Inbuilt Navigation (Shortest Route)
                </button>
                <button onclick="shareWhatsAppBill()" id="bill-btn" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl transition-all shadow-sm cursor-not-allowed text-xs flex items-center justify-center gap-1.5">
                    💬 Send WhatsApp Bill
                </button>
                <button onclick="completeRide()" id="complete-btn" hidden class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3 rounded-xl transition-all shadow-md cursor-pointer text-xs flex items-center justify-center gap-1.5">
                    🏁 Complete Ride & Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, pickupMarker, dropMarker, routeLine;
        let pickupCoords = null;
        let dropCoords = null;
        let actualKm = 0;      // Shortest route
        let displayedKm = 0;   // Longer route shown initially to customer
        let calculatedFare = 0;
        let searchTimeout = null;
        let routeSteps = [];

        function initMap() {
            map = L.map('map').setView([18.922, 72.834], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            map.on('click', function(e) {
                dropCoords = [e.latlng.lat, e.latlng.lng];
                setDropPin(dropCoords, "Pinned Location");
                if (pickupCoords) fetchRouteData();
            });
            getCurrentLocation();
        }

        function toggleSettings() {
            document.getElementById('settings-drawer').classList.toggle('hidden');
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        pickupCoords = [position.coords.latitude, position.coords.longitude];
                        setPickupPin(pickupCoords);
                        document.getElementById('pickup-text').innerText = `GPS Locked`;
                        map.setView(pickupCoords, 14);
                        if (dropCoords) fetchRouteData();
                    },
                    (error) => { alert("Please enable GPS permissions."); },
                    { enableHighAccuracy: true }
                );
            }
        }

        function setPickupPin(coords) {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker(coords).addTo(map).bindPopup("Driver Pickup");
        }

        function setDropPin(coords, name) {
            if (dropMarker) map.removeLayer(dropMarker);
            dropMarker = L.marker(coords, {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                })
            }).addTo(map).bindPopup(name).openPopup();
            
            document.getElementById('drop-text').innerText = name;
            map.setView(coords, 14);
        }

        function searchLocation(query) {
            clearTimeout(searchTimeout);
            let listDiv = document.getElementById('suggestions-list');
            if (query.length < 3) {
                listDiv.classList.add('hidden');
                return;
            }
            searchTimeout = setTimeout(async () => {
                let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=5`;
                try {
                    let response = await fetch(url);
                    let data = await response.json();
                    listDiv.innerHTML = '';
                    if (data.length > 0) {
                        data.forEach(item => {
                            let div = document.createElement('div');
                            div.className = "p-3 hover:bg-slate-800 border-b border-slate-800 text-xs text-slate-200 cursor-pointer font-medium flex items-center space-x-2";
                            div.innerHTML = `<span class="text-amber-400">📍</span> <span class="truncate">${item.display_name}</span>`;
                            div.onclick = () => {
                                dropCoords = [parseFloat(item.lat), parseFloat(item.lon)];
                                document.getElementById('search-input').value = item.display_name;
                                listDiv.classList.add('hidden');
                                setDropPin(dropCoords, item.display_name);
                                if (pickupCoords) fetchRouteData();
                            };
                            listDiv.appendChild(div);
                        });
                        listDiv.classList.remove('hidden');
                    } else {
                        listDiv.classList.add('hidden');
                    }
                } catch (e) { console.error(e); }
            }, 300);
        }

        // Fetch routes from OSRM with turn steps and alternatives
        async function fetchRouteData() {
            if (!pickupCoords || !dropCoords) return;
            const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords[1]},${pickupCoords[0]};${dropCoords[1]},${dropCoords[0]}?overview=full&geometries=geojson&steps=true&alternatives=true`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    // Shortest route is routes[0]
                    let shortestRoute = data.routes[0];
                    actualKm = shortestRoute.distance / 1000;
                    
                    // Add buffer/longer distance for initial customer bill view (~15-25% longer variant or padded)
                    displayedKm = actualKm * 1.22; 
                    
                    // Extract turn-by-turn instruction steps if available
                    if (shortestRoute.legs && shortestRoute.legs[0].steps) {
                        routeSteps = shortestRoute.legs[0].steps;
                    }

                    let durationMins = Math.round(shortestRoute.duration / 60);

                    if (routeLine) map.removeLayer(routeLine);
                    routeLine = L.geoJSON(shortestRoute.geometry, {
                        style: { color: '#f59e0b', weight: 6, opacity: 0.9 }
                    }).addTo(map);

                    // Initially show the longer distance/fare to the customer
                    updateFareDisplay(displayedKm, durationMins);
                }
            } catch (err) { console.error(err); }
        }

        function updatePricingConfig() {
            if (displayedKm > 0) {
                let durationMins = Math.round((displayedKm / 25) * 60);
                updateFareDisplay(displayedKm, durationMins);
            }
        }

        function updateFareDisplay(km, durationMins) {
            const baseFare = parseFloat(document.getElementById('setting-base').value) || 20;
            const perKmRate = parseFloat(document.getElementById('setting-per-km').value) || 12;
            const isNight = document.getElementById('setting-night').checked;
            const minPrice = 25;

            let total = baseFare;
            if (km > 2) {
                total += (km - 2) * perKmRate;
            }
            total = Math.max(minPrice, total);

            if (isNight) {
                total *= 1.25; 
                document.getElementById('night-badge').classList.remove('hidden');
            } else {
                document.getElementById('night-badge').classList.add('hidden');
            }

            calculatedFare = Math.round(total);

            document.getElementById('distance-display').innerText = `Distance: ${km.toFixed(1)} km`;
            if(durationMins > 0) document.getElementById('eta-display').innerText = `ETA: ${durationMins} mins`;
            document.getElementById('price-display').innerText = `₹${calculatedFare}`;

            document.getElementById('fare-card').classList.remove('hidden');
            
            // Activate action buttons
            let navBtn = document.getElementById('nav-btn');
            navBtn.disabled = false;
            navBtn.className = "w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl transition-all shadow-md cursor-pointer text-xs flex items-center justify-center gap-1.5";

            let billBtn = document.getElementById('bill-btn');
            billBtn.disabled = false;
            billBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl transition-all shadow-md cursor-pointer text-xs flex items-center justify-center gap-1.5";
        }

        // Start Inbuilt Navigation (Switches to Shortest Route view internally)
        function startInbuiltNavigation() {
            if (!pickupCoords || !dropCoords) return;

            // Update display to the actual shorter route for navigation performance
            document.getElementById('distance-display').innerText = `Distance: ${actualKm.toFixed(1)} km (Shortest)`;
            document.getElementById('nav-mode-dist').innerText = `${actualKm.toFixed(1)} km route`;
            
            // Show inbuilt navigation guidance box
            document.getElementById('nav-instructions').classList.remove('hidden');
            if (routeSteps.length > 0 && routeSteps[0].maneuver) {
                document.getElementById('step-instruction').innerText = `➡️ ${routeSteps[0].maneuver.instruction || "Proceed on route."}`;
            } else {
                document.getElementById('step-instruction').innerText = "Follow highlighted path directly to destination.";
            }

            // Swap buttons to show Complete Ride option
            document.getElementById('nav-btn').hidden = true;
            document.getElementById('complete-btn').hidden = false;
            document.getElementById('terminal-status').innerText = "● Trip in Progress (Inbuilt Nav)";
            document.getElementById('terminal-status').className = "text-[10px] text-amber-400 font-medium";
        }

        // Send WhatsApp Bill
        function shareWhatsAppBill() {
            let dropText = document.getElementById('drop-text').innerText;
            let nightActive = document.getElementById('setting-night').checked ? " (Night Shift)" : "";
            let message = `🧾 *RapidRide Bike Taxi Bill*:%0a*Fare:* ₹${calculatedFare}${nightActive}%0a*Distance:* ${displayedKm.toFixed(1)} km%0a*Drop:* ${dropText}%0a%0aThank you for riding with us!`;
            window.location.href = `https://wa.me/?text=${message}`;
        }

        // Complete Ride & Reset App state
        function completeRide() {
            alert("Trip completed successfully!");
            location.reload();
        }

        window.onload = initMap;
    </script>
</body>
</html>
